{% if data is string %}
  {{ data }}
{% else %}
  <table>
    <thead>
      <tr>
        {% for key, value in data[0] %}
          <th>{{ key }}</th>
        {% endfor %}
      </tr>
    </thead>
    <tbody>
      {% for row in data %}
        <tr>
          {% for key, value in row %}
            <td>{{ value }}</td>
          {% endfor %}
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endif %}
